<form class="search-panel" action="{{ url_for('items') }}" method="get" role="search" aria-label="Search reports">
  <label class="search-input-wrap"><span class="sr-only">Search reports</span><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"></circle><path d="m15.5 15.5 5 5"></path></svg><input name="q" type="search" value="{{ filters.q if filters else '' }}" placeholder="Search backpacks, keys, headphones…"></label>
  <fieldset class="kind-switch"><legend class="sr-only">Report type</legend>
    {% for value, label in [('', 'All'), ('Lost', 'Lost'), ('Found', 'Found')] %}<label><input type="radio" name="kind" value="{{ value }}" {% if (filters.kind if filters else '') == value %}checked{% endif %}><span>{{ label }}</span></label>{% endfor %}
  </fieldset>
  <label class="select-wrap"><span class="sr-only">Category</span><select name="category"><option value="">Category</option>{% for category in categories %}<option value="{{ category }}" {% if filters and filters.category == category %}selected{% endif %}>{{ category }}</option>{% endfor %}</select></label>
  <label class="select-wrap"><span class="sr-only">Location</span><select name="location"><option value="">Location</option>{% for location in locations %}<option value="{{ location }}" {% if filters and filters.location == location %}selected{% endif %}>{{ location }}</option>{% endfor %}</select></label>
  <button class="search-submit" type="submit">Search <span aria-hidden="true">→</span></button>
</form>
