<form class="search-panel" action="{{ url_for('items') }}" method="get" role="search" aria-label="Search reports">
  <div class="browse-searchbar"><label class="search-input-wrap"><span class="sr-only">Search reports</span><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"></circle><path d="m15.5 15.5 5 5"></path></svg><input name="q" type="search" value="{{ filters.q if filters else '' }}" placeholder="Search items, brands, or details"></label><button class="search-submit" type="submit">Search <span aria-hidden="true">→</span></button></div>
  <button class="filter-toggle" type="button" aria-expanded="false" aria-controls="browse-filterbar">Filters <span aria-hidden="true">＋</span></button>
  <div class="browse-filterbar" id="browse-filterbar">
    <fieldset class="kind-switch"><legend class="sr-only">Report type</legend>{% for value, label in [('', 'All items'), ('Lost', 'Lost'), ('Found', 'Found')] %}<label><input type="radio" name="kind" value="{{ value }}" {% if (filters.kind if filters else '') == value %}checked{% endif %}><span>{{ label }}</span></label>{% endfor %}</fieldset>
    <label class="select-wrap"><span class="sr-only">Category</span><select name="category"><option value="">All categories</option>{% for category in categories %}<option value="{{ category }}" {% if filters and filters.category == category %}selected{% endif %}>{{ category }}</option>{% endfor %}</select></label>
    <label class="select-wrap"><span class="sr-only">Location</span><select name="location"><option value="">All locations</option>{% for location in locations %}<option value="{{ location }}" {% if filters and filters.location == location %}selected{% endif %}>{{ location }}</option>{% endfor %}</select></label>
    <label class="select-wrap sort-wrap"><span class="sr-only">Sort reports</span><select name="sort"><option value="newest" {% if filters.sort == 'newest' %}selected{% endif %}>Newest first</option><option value="oldest" {% if filters.sort == 'oldest' %}selected{% endif %}>Oldest first</option>{% if filters.q %}<option value="relevance" {% if filters.sort == 'relevance' %}selected{% endif %}>Best match</option>{% endif %}</select></label>
    <button class="filter-apply" type="submit">Apply filters</button>
  </div>
</form>
