<article class="item-card">
  <a class="card-image scene-{{ 'photo' if item.photo_id else (item.image or 'none') }}" href="{{ url_for('item_detail', item_id=item.id) }}" aria-label="View {{ item.title }}">
    {% if item.photo_id %}<img class="item-photo" src="{{ url_for('item_photo', photo_id=item.photo_id) }}" alt="Photo of {{ item.title }}" loading="lazy">{% elif not item.image %}{% include '_placeholder.html' %}{% endif %}
    <span class="type-badge {{ item.kind|lower }}">{{ item.kind }}</span>
  </a>
  <div class="card-body">
    <div class="card-overline"><span>{{ item.item_type or item.category }}</span>{% if item.status == 'Returned' %}<span class="returned-tag">Returned</span>{% endif %}</div>
    <h3><a href="{{ url_for('item_detail', item_id=item.id) }}">{{ item.title }}</a></h3>
    <p class="card-description">{{ item.description }}</p>
    <div class="card-meta"><span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s7-6 7-12a7 7 0 0 0-14 0c0 6 7 12 7 12Z"></path><circle cx="12" cy="9" r="2"></circle></svg>{{ item.location }}</span><span><time datetime="{{ item.report_date }}">{{ item.report_date|readable_date }}</time></span></div>
  </div>
</article>
