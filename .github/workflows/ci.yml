name: FindIt SDSU CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    name: Run Tests & Database Verification
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Verify SQLite schema initialization
        run: |
          python -m app.init_db

      - name: Run Pytest test suite
        run: |
          pytest

      - name: Run SQLite query plan and benchmark evaluation
        run: |
          python -m database.evaluate
